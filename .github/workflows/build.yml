name: Build

# A push to main whose plugin version has no tag yet releases that version: the build signs it,
# then the jobs below publish it and tag the commit. Tags aren't pushed by hand, so each commit
# builds once.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main queue instead, so a release never stops halfway through publishing and the next
  # run sees its tag.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    # Apple silicon, macOS 27 and Xcode 27.1, the image's default Xcode. GitHub lists this image
    # as a preview; move to macos-27 once that label exists.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: plugin
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Check whether this push releases a new version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          tag="v$version"
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            release=true
          fi
          echo "Version $version, release: $release"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's downloads, Android Studio 2026.2.2 among them. The androidStudioPath in
      # gradle.properties doesn't exist on the runner, so the build downloads androidStudioVersion.
      - uses: gradle/actions/setup-gradle@v6

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          java -version

      - name: Test the helper
        working-directory: helper
        run: swift test

      - name: Test the plugin
        run: ./gradlew test

      - name: Build the plugin
        run: ./gradlew buildPlugin

      # Checks the plugin's API use against each verifyAndroidStudioVersions release in gradle.properties.
      - name: Verify against older Android Studio releases
        run: ./gradlew verifyPlugin

      # Writes simpanel-<version>-signed.zip next to the unsigned zip.
      - name: Sign the plugin
        if: steps.version.outputs.release == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      # The release jobs below take the zip from here, so rerunning one of them builds nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: simpanel-plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

  # Each release job reruns on its own: "Re-run failed jobs" repeats only the one that failed.
  github-release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: simpanel-plugin

      # Creates the tag on the built commit. Uploads the signed zip again when a rerun finds the
      # release already made.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *-signed.zip --clobber
          else
            gh release create "$TAG" *-signed.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  marketplace:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: simpanel-plugin

      # https://plugins.jetbrains.com/docs/marketplace/plugin-upload.html
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $PUBLISH_TOKEN" \
            --form xmlId=br.com.weslleycampos.simpanel \
            --form file=@"$(ls *-signed.zip)" \
            https://plugins.jetbrains.com/api/updates/upload
