org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
# The Android Studio the plugin compiles against and runIde starts. Override it in
# ~/.gradle/gradle.properties or with -PandroidStudioPath=... on another Mac.
androidStudioPath=/Volumes/Home/Applications/Android Studio.app
# The release Gradle downloads when androidStudioPath isn't installed, as on CI. 2026.2.2.8 is
# Android Studio 2026.2.2, build AI-262.10968.63.2622.16730706.
androidStudioVersion=2026.2.2.8
# The Android Studio releases verifyPlugin checks the plugin against.
verifyAndroidStudioVersions=2025.1.1.13,2026.1.4.7,2026.2.2.8
